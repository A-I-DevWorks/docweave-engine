[package]
name = "docweave-engine"
version = "0.1.0"
edition = "2024"
description = "Cross-language source documentation engine built around Tree-sitter adapters."
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.13"

[[bin]]
name = "docweave"
path = "src/main.rs"
