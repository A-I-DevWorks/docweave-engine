[package]
name = "docweave-engine"
version = "0.1.0"
edition = "2024"
description = "Cross-language source documentation engine built around Tree-sitter adapters."
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
pulldown-cmark = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
tree-sitter = "0.25"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-lua = "0.5.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.13"

[[bin]]
name = "docweave"
path = "src/main.rs"
